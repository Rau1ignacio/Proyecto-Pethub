<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PetHub | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="PetHub/static/style/estilo.css">
  <style>
    body{ background-image:url('PetHub/static/img/img/fondoWeb.png');}
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  
  <nav class="navbar navbar-expand-lg bg-light shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <img src="PetHub/static/img/img/LogoPerroYGato.jpg" alt="PetHub" width="36" height="36" class="rounded-circle">
        PetHub
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="home.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="explorar.html">Explorar Mascotas</a></li>
          <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login -->
  
  <main class="flex-grow-1 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <img src="PetHub/static/img/img/LogoPerroYGato.jpg" alt="logo PetHub" width="64" height="64" class="rounded-circle mb-2">
                <h1 class="h4 fw-bold mb-0">PetHub</h1>
                <p class="text-muted">Conecta con otros amantes de las mascotas</p>
              </div>

              <form onsubmit="event.preventDefault(); window.location.href='home.html';">
                <div class="mb-3">
                  <label for="usuario" class="form-label">Usuario o correo</label>
                  <input type="email" class="form-control" id="usuario" placeholder="tucorreo@pethub.com" required>
                </div>
                <div class="mb-2">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" placeholder="********" required>
                </div>
                <div class="d-flex justify-content-between mb-3">
                  <a href="#" class="small">Olvidé mi contraseña</a>
                  <a href="#" class="small">Crear una nueva cuenta</a>
                </div>
                <button class="btn btn-primary w-100">Iniciar sesión</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 small text-muted">© 2025 PetHub</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
